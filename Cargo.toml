[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
stacknote-core      = { path = "crates/core" }
stacknote-indexer   = { path = "crates/indexer" }
stacknote-llm       = { path = "crates/llm" }
stacknote-organizer = { path = "crates/organizer" }
serde     = { version = "1", features = ["derive"] }
thiserror = "2"